# XcodeGen manifest.
#
# The .xcodeproj is generated rather than committed: a project file is a merge
# conflict waiting to happen, and every setting that matters is more readable
# here than in a pbxproj.
#
#   brew install xcodegen && cd ios && xcodegen generate

name: iCam
options:
  bundleIdPrefix: com.icam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    # Localisation is designed in from the start; Arabic is a first-class
    # layout direction, not an afterthought.
    SWIFT_EMIT_LOC_STRINGS: YES

configs:
  Debug: debug
  Release: release

targets:
  iCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iCam
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icam.app
        PRODUCT_NAME: iCam
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: iCam/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: "$(inherited)"
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: YES

  iCamTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iCamTests
      # The conformance vectors are the shared source of truth for both
      # implementations, so the Swift tests read the very same file the C#
      # tests do rather than a copy that could drift.
      - path: ../protocol/vectors
        buildPhase: resources
    dependencies:
      - target: iCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icam.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  iCam:
    build:
      targets:
        iCam: all
        iCamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - iCamTests
    archive:
      config: Release
